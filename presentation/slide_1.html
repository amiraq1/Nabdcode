<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Cairo', sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .accent-box {
            position: absolute;
            width: 300px;
            height: 300px;
            border: 4px solid #BB86FC;
            opacity: 0.1;
            transform: rotate(45deg);
            top: -100px;
            right: -100px;
        }
        
        .accent-box-2 {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 4px solid #03DAC6;
            opacity: 0.1;
            transform: rotate(15deg);
            bottom: -50px;
            left: -50px;
        }

        .content-wrapper {
            text-align: center;
            z-index: 10;
            max-width: 900px;
        }

        h1 {
            color: #FFFFFF;
            font-weight: 800;
            font-size: 80px;
            line-height: 1.2;
            margin-bottom: 24px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        h2 {
            color: #03DAC6;
            font-weight: 400;
            font-size: 36px;
            margin-bottom: 60px;
            letter-spacing: 1px;
        }

        .meta-info {
            color: #B3B3B3;
            font-size: 24px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        
        .meta-info span {
            color: #BB86FC;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-box"></div>
        <div class="accent-box-2"></div>
        
        <div class="content-wrapper">
            <h1>شارات الأدوات في Nabdcode</h1>
            <h2>من حدث التنفيذ إلى رأس طرفي آمن وواضح</h2>
            
            <div class="meta-info">
                Manus AI <span>·</span> أغسطس 2026
            </div>
        </div>
    </div>
</body>
</html>
