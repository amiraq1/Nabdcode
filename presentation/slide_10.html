<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #121212;
            font-family: 'Cairo', sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
        }
        
        h1 {
            color: #FFFFFF;
            font-weight: 800;
            font-size: 54px;
            margin-bottom: 80px;
            text-align: center;
        }

        .flow-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            width: 90%;
            margin-bottom: 100px;
        }

        .flow-step {
            background: rgba(255,255,255,0.03);
            border: 2px solid #333;
            padding: 30px 20px;
            text-align: center;
            flex: 1;
            position: relative;
        }
        
        .flow-step:nth-child(1) { border-top-color: #BB86FC; }
        .flow-step:nth-child(3) { border-top-color: #03DAC6; }
        .flow-step:nth-child(5) { border-top-color: #BB86FC; }
        .flow-step:nth-child(7) { border-top-color: #03DAC6; }

        .step-title {
            color: #FFFFFF;
            font-weight: 800;
            font-size: 28px;
        }

        .flow-arrow {
            color: #666;
            font-size: 36px;
            font-weight: 800;
        }

        .conclusion-box {
            border-right: 6px solid #BB86FC;
            padding: 30px 40px;
            width: 80%;
            background: rgba(187, 134, 252, 0.05);
        }

        .conclusion-text {
            color: #E6E6E6;
            font-size: 36px;
            font-weight: 400;
            line-height: 1.6;
            text-align: center;
        }
        
        .highlight {
            color: #03DAC6;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <h1>الخلاصة: وضوح تشغيلي دون توسيع الصلاحيات</h1>
        
        <div class="flow-container">
            <div class="flow-step">
                <div class="step-title">تصنيف دلالي</div>
            </div>
            <div class="flow-arrow">←</div>
            <div class="flow-step">
                <div class="step-title">سياق محدود</div>
            </div>
            <div class="flow-arrow">←</div>
            <div class="flow-step">
                <div class="step-title">رسم موحّد</div>
            </div>
            <div class="flow-arrow">←</div>
            <div class="flow-step">
                <div class="step-title">مخرجات آمنة</div>
            </div>
        </div>
        
        <div class="conclusion-box">
            <div class="conclusion-text">
                Nabdcode يقدّم واجهة طرفية <span class="highlight">قابلة للمراجعة</span>، مع فصل واضح بين <span class="highlight">قرار التنفيذ</span> وتمثيله البصري.
            </div>
        </div>
    </div>
</body>
</html>
