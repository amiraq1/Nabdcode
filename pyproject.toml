[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nabd-os"
version = "1.0.0"
description = "Local AI Agent OS & TUI specialized for Termux and Edge Devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0",
    "textual>=0.40.0",
    "numpy>=1.24.0",
    # Declarative .nabd/skills frontmatter parser used by core.skills.
    "PyYAML>=6.0",
    # CFD-pyproject-1: core/config.py uses AES-GCM (cryptography) to encrypt
    # BYOK API keys at rest — a clean install without it fails on first save.
    "cryptography>=42.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12",
]

[project.scripts]
nabdcode = "main:main"

[tool.setuptools]
py-modules = ["main", "llm_router", "nabd_logo"]
# NBD-01: ship runtime data (skills markdown docs) in the wheel.
include-package-data = true

# NBD-01 (release blocker fix): the boot path imports nested + sibling
# packages (core.kernel, core.security, core.dag, ui.design, skills,
# smolagents, adapters...). A manual top-level list silently omitted them,
# so a clean install crashed with ModuleNotFoundError. Use controlled
# discovery instead of maintaining a hand-written list.
[tool.setuptools.packages.find]
include = ["adapters*", "core*", "engine*", "skills*", "smolagents*", "tools*", "ui*"]

[tool.setuptools.package-data]
skills = ["*.md"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "termux: Tests that require a Termux environment; skip on other platforms.",
    "slow: Tests that take >30s; use --runslow to include.",
]
